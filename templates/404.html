{% extends "base.html" %}
{% import "_macros.html" as m %}

{% block head %}
{{ m.head(page_title, page_desc, '', root, '', '', '', hl, T.brand) }}
{% endblock %}

{% block content %}
<section style="padding:170px 0 120px;text-align:center">
  <div class="wrap">
    <p class="eyebrow" style="justify-content:center">Error 404</p>
    <h1 style="font-size:clamp(2rem,5vw,3.4rem);letter-spacing:.1em">{{ T.e.h1 }}</h1>
    <p style="color:var(--ink-2);max-width:30em;margin:22px auto 0;line-height:1.95">
      {{ T.e.body|safe }}
    </p>
    <div style="margin-top:36px">
      <a class="btn" href="{{ pr }}index.html">{{ T.e.back }} {{ m.icon('arrow') }}</a>
    </div>
  </div>
</section>
{% endblock %}
